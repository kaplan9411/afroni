<style>

html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Varela Round","Arial Rounded MT Bold",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.pill{background:rgba(0,0,0,.38);border-radius:14px;padding:4px 10px;white-space:nowrap}

.hgrp{display:flex;gap:6px;align-items:center}

const cv=$('cv');let c=cv.getContext('2d');
const VH=370, GROUND=290, GRAV=1800, T=32;

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  portrait=w/h<1.15;
  if(!portrait){S=h/VH;viewW=w/S;viewH=VH;offY=0;}
  else{viewW=560;S=w/viewW;viewH=h/S;offY=Math.max(0,viewH-VH-170/S);}
}
window.addEventListener('resize',resize);resize();

// ---------- helpers
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h1(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}

function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type='square',v=.05,f2=null,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}
const SFX={

  stomp:()=>{tone(500,.08,'square',.05,200);tone(800,.1,'square',.04,null,.06)},

  swing:()=>tone(420,.07,'triangle',.05,900),

// ---------- UI: dialog / toast
let DQ=null;
function say(lines,done){
  if(!lines||!lines.length){done&&done();return}
  for(const k in K)K[k]=0;
  document.querySelectorAll('.cb.on').forEach(b=>b.classList.remove('on'));
  DQ={lines,i:0,done,t0:performance.now()};showLine();$('dialog').style.display='block';
}
function showLine(){
  const [who,text]=DQ.lines[DQ.i];const sp=SPEAKERS[who];
  $('dbox').className='dbox '+sp.cls;
  $('dwho').textContent=who==='kid'?((KIDS[kidId].g==='m'?'🧒 ':'👧 ')+N()):sp.who;
  $('dtext').textContent=text;
  $('dbox').style.animation='none';void $('dbox').offsetWidth;$('dbox').style.animation='';
}
function advance(){
  if(!DQ)return;if(performance.now()-DQ.t0<260)return;
  DQ.i++;DQ.t0=performance.now();
  if(DQ.i>=DQ.lines.length){$('dialog').style.display='none';const d=DQ.done;DQ=null;d&&d()}else showLine();
}
$('dialog').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();advance()});
let toastTO=null;

const KEYMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',x:'atk',X:'atk',j:'atk',f:'atk',z:'sw',Z:'sw',k:'sw',q:'sw',Shift:'sw'};
function press(k,v){
  if(k==='jump'){if(v&&!K.jump)jumpBuf=.15;K.jump=v}
  else if(k==='atk'){if(v&&!K.atk)atkPress=1;K.atk=v}
  else if(k==='sw'){if(v)swPress=1}

}
window.addEventListener('keydown',e=>{
  initAudio();
  if(DQ&&(e.key==='Enter'||e.key===' '||e.key==='x'||e.key==='X')){e.preventDefault();if(!e.repeat)advance();return}
  const k=KEYMAP[e.key];if(k){e.preventDefault();if(!e.repeat)press(k,1)}
  if(e.key==='Escape'||e.key==='p')togglePause();
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)press(k,0)});
document.querySelectorAll('.cb').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');press(k,1)});
  const up=e=>{b.classList.remove('on');press(k,0)};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

// ---------- level building
function newLevel(type,len){return{type,len,solids:[],coins:[],pickups:[],enemies:[],friends:[],shots:[],eshots:[],waves:[],parts:[],warns:[],boss:null,arenaX:0,arenaW:0,locked:false,triggers:[],timers:[],vehicles:[],prog:{coins:0,star:0,gem:0},done:false,t:0}}
function addSolid(L,x,y,w,h,kind,ex){const s=Object.assign({x,y,w,h,kind,bump:0},ex||{});L.solids.push(s);return s}
function groundSegs(L,rng,len,gapP,safeS,safeE){
  const gaps=[];let x=0;
  while(x<len-1){
    let w=x===0?safeS:260+rng()*320;if(x+w>len-safeE)w=len-x;
    addSolid(L,x,GROUND,w,220,'ground');x+=w;
    if(x<len-safeE&&rng()<gapP){const gw=72+Math.floor(rng()*34);gaps.push({x,w:gw});x+=gw}
  }
  return gaps;
}
function hasGround(L,x,w){return L.solids.some(s=>s.kind==='ground'&&s.x<=x&&s.x+s.w>=x+w)}
function row(L,x,y,n,qi,content){for(let i=0;i<n;i++){const q=i===qi;addSolid(L,x+i*T,y,T,T,q?'q':'brick',q?{content}:null)}}
function coinLine(L,x,y,n,sp=26){for(let i=0;i<n;i++)L.coins.push({x:x+i*sp,y,taken:false})}
function mkPickup(kind,x,y,sub,rise){return{kind,x,y,w:24,h:24,sub,rise:rise||0,taken:false}}
function gapCoins(L,gaps){for(const gp of gaps){const cx=gp.x+gp.w/2;for(let k=0;k<4;k++)L.coins.push({x:cx+(k-1.5)*22,y:GROUND-62-((k===1||k===2)?18:0),taken:false})}}

function genIntro(v2){
  const len=2050,L=newLevel('school',len);L.v2=v2;const SI=v2?STORY.intro2:STORY.intro;
  addSolid(L,0,GROUND,len,220,'ground');
  addSolid(L,-60,-600,60,1200,'wall');addSolid(L,len,-600,60,1200,'wall');
  row(L,470,GROUND-96,3,1,'coin');coinLine(L,474,GROUND-122,3,32);
  addSolid(L,700,GROUND-40,40,40,'crate');coinLine(L,690,GROUND-70,3,26);
  coinLine(L,1150,GROUND-30,5);
  addSolid(L,1300,GROUND-40,40,40,'crate');addSolid(L,1340,GROUND-80,40,80,'crate');coinLine(L,1338,GROUND-112,2,26);
  coinLine(L,1550,GROUND-30,4);
  L.vehicles=[{kind:'shuttle',x:860,w:132,h:62,vx:0,go:false,on:true},{kind:'bus',x:-999,w:236,h:84,vx:0,go:false,on:false}];
  L.magic={x:1820,y:GROUND-9};
  L.triggers=[
    {x:520,fn:()=>{L.vehicles[0].go=true;SFX.honk();L.timers.push({t:1.6,fn:()=>say(SI.missed())})}},
    {x:1560,fn:()=>say(SI.shiny())}
  ];
  if(!v2)L.triggers.splice(1,0,{x:1090,fn:()=>{const b=L.vehicles[1];b.on=true;b.go=true;b.x=cam.x-260;b.vx=250;SFX.honk();L.timers.push({t:1.9,fn:()=>say(STORY.intro.bus())})}});
  return L;
}

function addFriends(L,rng,n,len){const cols=['#ff7eb6','#7fd3ff','#9be36a','#ffb347','#c59bff','#ffe14d'];for(let i=0;i<n;i++){const x=300+rng()*(len-500);if(hasGround(L,x-14,28))L.friends.push({x,col:cols[i%cols.length],ph:rng()*6})}}

function genDay(n){
  const rng=mulberry(1000+n*77),len=3400,L=newLevel('day',len);
  const st=STAGES[G.stage];L.mission=st.mission;
  const gaps=groundSegs(L,rng,len,.32,520,500);
  addSolid(L,-60,-600,60,1200,'wall');addSolid(L,len,-600,70,1200,'endwall');
  const itemKind=st.mission.items?Object.keys(st.mission.items)[0]:null;
  const NS=8,step=(len-900)/NS;
  for(let i=0;i<NS;i++){
    const x=Math.round((440+i*step+rng()*50)/8)*8,yr=GROUND-96;let endX;
    if(i===4){row(L,x,yr,5,2,'weapon:'+st.mission.weapon);coinLine(L,x+6,yr-26,2,28);coinLine(L,x+102,yr-26,2,28);endX=x+160}
    else if(i===1||i===3||i===6){
      row(L,x,yr,4,-1);const x2=x+4*T+18;row(L,x2,GROUND-180,3,-1);coinLine(L,x+6,yr-26,4,30);
      if(itemKind)L.pickups.push(mkPickup(itemKind,x2+36,GROUND-180-34));else coinLine(L,x2+8,GROUND-206,3,30);
      endX=x2+96;
    } else {
      const nb=3+Math.floor(rng()*3),q=Math.floor(rng()*nb);row(L,x,yr,nb,q,rng()<.25?'heart':'coin');coinLine(L,x+6,yr-26,nb,T);endX=x+nb*T;
    }
    const nx=440+(i+1)*step;
    if(endX+130<nx&&i<NS-1){const px=Math.round((endX+(nx-endX)/2-22)),ph=rng()<.5?48:64;
      if(hasGround(L,px-10,64))addSolid(L,px,GROUND-ph,44,ph,'pipe');else if(hasGround(L,endX+30,120))coinLine(L,endX+40,GROUND-30,4)}
  }
  gapCoins(L,gaps);coinLine(L,180,GROUND-30,4);
  addFriends(L,rng,6,len);
  return L;
}

function mkEnemy(type,x,rng){
  if(type==='scribble')return{type,x,y:GROUND-26,w:28,h:26,vx:0,vy:0,dir:-1,hp:1,alive:true,lastSwing:-1,flash:0};
  if(type==='blob')return{type,x,y:GROUND-24,w:30,h:24,vx:0,vy:0,hp:2,t:.5+rng(),alive:true,lastSwing:-1,flash:0};
  if(type==='crumb')return{type,x,y:GROUND-20,w:28,h:20,vx:0,vy:0,hp:2,t:.5+rng(),alive:true,lastSwing:-1,flash:0};
  return{type:type==='ghost'?'ghost':'bat',x,y:GROUND-140,w:32,h:20,bx:x,by:GROUND-120-rng()*70,t:rng()*6,hp:1,alive:true,lastSwing:-1,flash:0};
}

function genNight(n,lair){
  const rng=mulberry(5000+n*131),len=lair?1800:2900,L=newLevel(lair?'lair':'night',len);
  const st=STAGES[G.stage];
  const gaps=groundSegs(L,rng,len,lair?.22:.26,520,420);
  const NS=lair?4:7,step=(len-900)/NS;
  for(let i=0;i<NS;i++){
    const x=Math.round((460+i*step+rng()*60)/8)*8,nb=3+Math.floor(rng()*3),q=Math.floor(rng()*nb);
    row(L,x,GROUND-96,nb,q,(i%3===1)?'heart':'coin');coinLine(L,x+6,GROUND-122,nb,T);
    if(rng()<.45)L.enemies.push(mkEnemy('bat',x+nb*16,rng));
  }
  gapCoins(L,gaps);
  const types=n===1?['scribble','scribble','blob']:n===2?['scribble','blob','bat']:['scribble','blob','blob','bat'];
  const cnt=lair?9:7+n*3;
  for(let i=0;i<cnt;i++){
    const t=types[Math.floor(rng()*types.length)],x=600+rng()*(len-800);
    if(t==='bat'||hasGround(L,x-20,70))L.enemies.push(mkEnemy(t,x,rng));
  }
  const AW=Math.max(820,Math.ceil(viewW)+20);
  L.arenaX=len;L.arenaW=AW;
  addSolid(L,len,GROUND,AW+80,220,'ground');
  addSolid(L,-60,-600,60,1200,'wall');addSolid(L,len+AW,-600,60,1200,'wall');
  L.arenaWall=addSolid(L,len-30,-600,30,GROUND+600,'wall',{off:true});
  L.boss=makeBoss(st.boss,len+AW-190);
  return L;
}

function genFinal(){
  const AW=Math.max(820,Math.ceil(viewW)+20),L=newLevel('final',AW);
  L.arenaX=0;L.arenaW=AW;L.locked=true;L.phase='pre';

  const cols=['#ff7eb6','#7fd3ff','#9be36a','#ffb347','#c59bff','#ffe14d','#7fffd4'];

  const B=makeBoss('evilFinal',AW-200);B.y=-420;B.vis=false;L.boss=B;

}

function genScary(n){
  const rng=mulberry(9000+n*211),len=2900,L=newLevel('scary',len);
  const st=STAGES[G.stage];L.mission=st.mission;
  const gaps=groundSegs(L,rng,len,.28,520,420);
  const itemKind=Object.keys(st.mission.items)[0];
  const NS=7,step=(len-900)/NS;let ii=0;
  for(let i=0;i<NS;i++){
    const x=Math.round((460+i*step+rng()*50)/8)*8,yr=GROUND-96;
    if(i===1||i===3||i===5){row(L,x,yr,4,-1);const x2=x+4*T+18;row(L,x2,GROUND-180,3,-1);coinLine(L,x+6,yr-26,4,30);
      const pk=mkPickup(itemKind,x2+36,GROUND-180-34);pk.idx=ii++;L.pickups.push(pk)}
    else{const nb=3+Math.floor(rng()*3),q=Math.floor(rng()*nb);row(L,x,yr,nb,q,i%3===0?'heart':'coin');coinLine(L,x+6,yr-26,nb,T)}
  }
  gapCoins(L,gaps);
  const types=n===1?['crumb','scribble','crumb']:n===2?['crumb','ghost','crumb','ghost']:['crumb','ghost','scribble','crumb','ghost'];
  const cnt=8+n*3;

  addSolid(L,len,GROUND,AW+80,220,'ground');
  addSolid(L,-60,-600,60,1200,'wall');addSolid(L,len+AW,-600,60,1200,'wall');
  L.arenaWall=addSolid(L,len-30,-600,30,GROUND+600,'gate',{off:false});

  return L;
}

function makeBoss(type,x){

// ---------- stage flow
function startStage(i,retry,atBoss){
  G.stage=i;const st=STAGES[i];
  if(!retry){G.snap={weapons:[...G.weapons],weapon:G.weapon,coins:G.coins};G.bossSnap=null}
  else{const sn=atBoss&&G.bossSnap?G.bossSnap:G.snap;G.weapons=[...sn.weapons];G.weapon=sn.weapon;G.coins=sn.coins}
  if(st.type==='school')L=genIntro(st.id==='intro2');
  else if(st.type==='day')L=genDay(st.n);
  else if(st.type==='night')L=genNight(st.n,false);
  else if(st.type==='lair')L=genNight(4,true);
  else if(st.type==='scary')L=genScary(st.n);
  else if(st.type==='cut')L=genCut();
  else if(st.type==='merge')L=genMerge();
  else L=genFinal();
  P=makePlayer(st.type==='final');
  if(st.type==='school')P.x=170;
  P.safeS=L.solids[0];P.safeX=P.x;
  if(st.type==='merge')P.x=120;
  PEN={x:P.x-30,y:P.y-40,vis:st.type!=='school'&&st.type!=='cut',kind:'pencil'};
  PEN2=st.type==='merge'||st.type==='scary'?{x:P.x+30,y:P.y-40,vis:true}:null;
  if(st.type==='cut')P.hidden=true;
  if(st.type==='final'){P.hidden=true;PEN.x=110;PEN.y=GROUND-80}
  cam.x=st.type==='final'?(L.arenaW-viewW)/2:0;
  G.mode='play';G.paused=false;shake=0;
  $('hud').style.display='flex';$('controls').style.display='block';$('menu').style.display='none';$('end').style.display='none';
  $('bossbar').style.display='none';
  const s=STORY[st.id];
  if(st.type==='cut'){say(s.start(),()=>nextStage())}
  else if(atBoss&&st.type==='merge'){const B=L.boss;L.phase='fight';L.fused=true;B.vis=true;B.y=GROUND-B.h;B.active=true;toast('💪 שוב מול '+B.name+'!',2200)}
  else if(st.type==='merge'){say(s.start(),()=>{L.phase='merge';L.mergeT=0;SFX.tele()})}
  else if(atBoss&&st.type==='final'){const B=L.boss;L.phase='fight';L.landed=true;P.hidden=false;PEN.vis=false;B.vis=true;B.y=GROUND-B.h;B.active=true;toast('💪 שוב מול '+B.name+'!',2200)}
  else if(atBoss&&L.boss){const B=L.boss;P.x=L.arenaX+100;P.y=GROUND-P.h;P.safeS=L.solids.find(q=>q.kind==='ground'&&q.x===L.arenaX);P.safeX=P.x;PEN.x=P.x-30;PEN.y=P.y-40;
    L.locked=true;L.gateOpen=true;L.arenaWall.off=false;B.active=true;cam.x=L.arenaX+(L.arenaW-viewW)/2;toast('💪 שוב מול '+B.name+'!',2200)}
  else if(st.type==='final'){
    if(!retry)say(s.start(),()=>{L.phase='fall';L.boss.vis=true});
    else{L.phase='fall';L.boss.vis=true}
  } else if(!retry&&s&&s.start)say(s.start());
  else toast(st.name+' · '+missionText(),2600);
  if(portrait&&!G.rotHint){G.rotHint=1;setTimeout(()=>toast('💡 עדיף לשחק כשהטלפון לרוחב 📱↔️'),2800)}
}
function nextStage(){
  const cur=STAGES[G.stage].type;G.stage++;
  if(G.stage>=STAGES.length){showEnd();return}
  save();
  const nt=STAGES[G.stage].type;
  const col=cur==='school'?'#ffffff':nt==='cut'||nt==='school'?'#000':nt==='merge'?'#ffffff':nt==='night'?'#160830':nt==='day'?'#ffe2a0':nt==='lair'?'#000':'#ffffff';
  fadeTo(col,()=>startStage(G.stage));
}
function fadeTo(col,cb){fade={a:0,dir:1,col,cb}}
function playerDie(){
  if(P.dead)return;P.dead=true;P.hp=0;P.vy=-380;SFX.hurt();
  const atBoss=!!(L.boss&&!L.boss.dead&&(L.locked&&((L.type!=='final'&&L.type!=='merge')||L.phase==='fight')));
  L.timers.push({t:.9,fn:()=>say([['pen',atBoss?`אוי! לא נורא, ${N()} – ננסה שוב מול הבוס! 💪`:`אוי! לא נורא, ${N()} – ננסה שוב! 💪`]],()=>fadeTo('#000',()=>startStage(G.stage,true,atBoss)))});
}
function missionText(){
  const st=STAGES[G.stage];if(!L)return'';
  if(st.type==='school')return'🏠 '+g('לך','לכי')+' לתחנת ההסעה';
  if(st.type==='day'){const M=st.mission,p=L.prog,parts=[];
    if(M.coins)parts.push(`🪙 ${Math.min(p.coins,M.coins)}/${M.coins}`);
    if(M.items)for(const k in M.items)parts.push(`${k==='star'?'⭐':'💎'} ${p[k]}/${M.items[k]}`);
    parts.push(`${WEAPONS[M.weapon].icon} ${G.weapons.includes(M.weapon)?'✅':'❓'}`);return'📜 '+parts.join('  ')}
  if(st.type==='final')return'📜 '+g('הבס','הביסי')+' את העפרון השחור!';
  if(st.type==='cut')return'';
  if(st.type==='merge')return'📜 '+g('נצח','נצחי')+' את מחקפרון הענק!';
  if(st.type==='scary'){if(!L.gateOpen){const parts=[];for(const k in st.mission.items)parts.push(`${ITEMICON[k]} ${L.prog[k]||0}/${st.mission.items[k]}`);return'📜 '+parts.join('  ')}
    return'📜 '+g('נצח','נצחי')+' את '+BOSSNAME[st.boss]}
  return'📜 '+g('נצח','נצחי')+' את '+BOSSNAME[st.boss];
}
function missionDone(){const M=STAGES[G.stage].mission,p=L.prog;if(M.items)for(const k in M.items)if((p[k]||0)<M.items[k])return false;if(!M.weapon)return true;if(M.coins&&p.coins<M.coins)return false;if(M.items)for(const k in M.items)if(p[k]<M.items[k])return false;return G.weapons.includes(M.weapon)}
function checkMission(){
  if(L.type==='scary'&&!L.gateOpen&&missionDone()){L.gateOpen=true;L.arenaWall.off=true;SFX.win();for(let i=0;i<24;i++)spark(P.x+12,P.y,['#ff8fb3','#7fffd4','#ffe14d'][i%3]);
    L.timers.push({t:.5,fn:()=>say([['mah','המשימה הושלמה! 🎉 השער בסוף השלב נפתח!'],['mah',`עכשיו ${g('רוץ','רוצי')} לסוף השלב – מחק רשע מחכה שם 👊`]])});return}
  if(L.type!=='day'||L.done)return;
  if(missionDone()){L.done=true;SFX.win();for(let i=0;i<30;i++)spark(P.x+12,P.y,['#ffe14d','#ff7eb6','#7fd3ff'][i%3]);
    L.timers.push({t:.8,fn:()=>say(STORY[STAGES[G.stage].id].end(),()=>nextStage())})}
}
function showEnd(){
  G.mode='end';clearSave();SFX.win();
  $('hud').style.display='none';$('controls').style.display='none';$('bossbar').style.display='none';
  $('endTxt').textContent=`${N()}, עפרוני ומחקי ניצחו את מחקפרון הענק! 🌈 העפרון השחור והמחק השחור הפכו לחברים, הצבעים חזרו לשני העולמות, ו${N()} ${g('הגיע','הגיעה')} הביתה בדיוק בזמן לארוחת ערב 🏠😄`;
  $('endStats').textContent=`🪙 ${G.coins} מטבעות נאספו`;
  $('end').style.display='flex';G.confetti=[];
}

// ---------- particles
function puff(x,y,col,n=8,sp=130){for(let i=0;i<n;i++)L.parts.push({x,y,vx:(Math.random()-.5)*2*sp,vy:(Math.random()-.5)*2*sp-40,life:.5+Math.random()*.3,max:.8,col,sz:3+Math.random()*3,g:350})}
function spark(x,y,col){L.parts.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*300,life:1,max:1,col,sz:3,g:250,star:true})}
function ftext(x,y,txt,col='#fff'){L.parts.push({x,y,vx:0,vy:-55,life:.9,max:.9,txt,col,g:0})}

// ---------- physics
function physics(b,dt){
  b.vy=Math.min(b.vy+GRAV*dt,950);
  const dx=b.vx*dt,dy=b.vy*dt;b.onGround=false;b.hitWall=0;b.heads=null;
  if(b.vy>0){moveY(b,dy);moveX(b,dx)}else{moveX(b,dx);moveY(b,dy)}
}
function moveX(b,dx){b.x+=dx;if(!dx)return;for(const s of L.solids){if(s.off||!ov(b,s))continue;if(dx>0){b.x=s.x-b.w;b.hitWall=1}else{b.x=s.x+s.w;b.hitWall=-1}}}
function moveY(b,dy){b.y+=dy;for(const s of L.solids){if(s.off||!ov(b,s))continue;
  if(dy>0){b.y=s.y-b.h;b.vy=0;b.onGround=true;b.groundS=s}
  else if(dy<0){b.y=s.y+s.h;b.vy=0;(b.heads||(b.heads=[])).push(s)}}}
function solidAt(x,y){for(const s of L.solids){if(s.off)continue;if(x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h)return s}return null}

// ---------- gameplay
function addCoin(x,y){G.coins++;L.prog.coins++;SFX.coin();ftext(x,y,'+1','#ffe14d');checkMission()}
function headHit(s){
  if(s.kind!=='q'&&s.kind!=='brick')return;
  s.bump=.16;
  if(s.kind==='q'&&!s.used){s.used=true;const ct=s.content||'coin';
    if(ct==='coin'){addCoin(s.x+16,s.y-12);L.parts.push({x:s.x+16,y:s.y-10,vx:0,vy:-260,life:.45,max:.45,g:900,coin:true})}
    else if(ct==='heart'){L.pickups.push(mkPickup('heart',s.x+4,s.y-4,null,.35));SFX.power()}
    else{L.pickups.push(mkPickup('weapon',s.x+4,s.y-4,ct.split(':')[1],.35));SFX.power()}
  } else SFX.bump();
}
function hurtPlayer(n,fromX){
  if(P.inv>0||P.dead||P.hidden||(L.tele))return;
  if(P.shieldT>0){for(let i=0;i<6;i++)spark(P.x+P.w/2,P.y+P.h/2,'#ffe14d');return}
  P.hp-=n;P.inv=1.3;const d=(P.x+P.w/2<fromX)?-1:1;P.vx=d*240;P.vy=-330;SFX.hurt();shake=6;
  if(P.hp<=0)playerDie();
}
function fallPit(){
  P.hp-=1;SFX.hurt();
  if(P.hp<=0){P.y=VH+200;playerDie();return}
  const s=P.safeS||L.solids[0];P.x=clamp(P.safeX,s.x+16,s.x+s.w-P.w-16);P.y=GROUND-P.h-70;P.vx=P.vy=0;P.inv=1.5;toast('אופס! 🙈',1200);
}
function damageEnemy(e,d){
  e.hp-=d;e.flash=.12;SFX.hit();puff(e.x+e.w/2,e.y+e.h/2,'#fff',5);
  if(e.hp<=0){e.alive=false;puff(e.x+e.w/2,e.y+e.h/2,'#2a1650',12,170);G.coins++;ftext(e.x+e.w/2,e.y,'+1 🪙','#ffe14d')}
}
function damageBoss(B,d){
  if(B.dead||!B.active)return;B.hp-=d;B.flash=.12;SFX.hit();puff(B.x+B.w/2,B.y+B.h/3,'#fff',6);
  if(B.type==='eraser'&&!B.escaped&&B.hp<=B.maxHp*.25){B.escaped=true;B.active=false;B.vx=0;shake=10;SFX.boss();
    L.timers.push({t:.4,fn:()=>say(STORY.scary3.escape(),()=>{puff(B.x+B.w/2,B.y+B.h/2,'#b44dff',30,240);B.vis=false;L.timers.push({t:.7,fn:()=>nextStage()})})});return}
  if(B.type==='merged'){const k=Math.floor(Math.max(0,B.hp)/10);if(k<B.lastK&&B.hp>0){B.lastK=k;L.pickups.push(mkPickup('heart',clamp(P.x+(Math.random()<.5?-1:1)*(80+Math.random()*80),L.arenaX+40,L.arenaX+L.arenaW-70),GROUND-56))}}
  if(B.hp<=0){B.hp=0;B.dead=true;B.deadT=0;shake=14;SFX.win();
    for(let i=0;i<40;i++)spark(B.x+B.w/2,B.y+B.h/2,['#ffe14d','#ff7eb6','#7fd3ff','#9be36a'][i%4]);
    G.coins+=10;ftext(B.x+B.w/2,B.y,'+10 🪙','#ffe14d');
    const st=STAGES[G.stage];
    if(st.type==='final')L.timers.push({t:1.4,fn:()=>say(STORY.final.end(),()=>{puff(B.x+B.w/2,GROUND-40,'#222',30,220);B.vis=false;L.timers.push({t:.8,fn:()=>say(STORY.final.end2(),()=>nextStage())})})});
    else if(st.type==='merge')L.timers.push({t:1.6,fn:()=>{B.split=true;say(STORY.merge.end(),()=>fadeTo('#fff',()=>showEnd()))}});
    else L.timers.push({t:1.4,fn:()=>say(STORY[st.id].end(),()=>nextStage())});
  }
}
function slam(B){shake=10;SFX.slam();const cx=B.x+B.w/2;L.waves.push({x:cx-20,dir:-1,life:2.4,h:22},{x:cx+20,dir:1,life:2.4,h:22});puff(cx,GROUND-4,'#3a1d66',14,160)}
function eshot(kind,x,y,vx,vy,gr,r){L.eshots.push({kind,x,y,vx,vy,g:gr,r,life:4})}

function doAttack(){
  const p=P;
  if(p.giant){p.atkCd=.3;p.atkT=.22;L.shots.push({kind:'beam',x:p.x+p.w/2+p.face*30-14,y:p.y+40,w:28,h:28,vx:p.face*620,dmg:2,life:1.4,hit:new Set()});SFX.shoot();return}
  const W=WEAPONS[G.weapon];p.atkCd=W.cd;p.atkT=.2;p.swing++;
  if(W.type==='shot'){const rb=G.weapon==='rainbow';L.shots.push({kind:G.weapon,x:p.x+p.w/2+p.face*14-(rb?14:7),y:p.y+15,w:rb?28:14,h:rb?10:9,vx:p.face*W.speed,dmg:W.dmg,life:1.3,pierce:!!W.pierce,hit:new Set()});SFX.shoot()}
  else SFX.swing();
}

function updatePlayer(dt){
  const p=P;
  if(p.inv>0)p.inv-=dt;if(p.atkCd>0)p.atkCd-=dt;if(p.atkT>0)p.atkT-=dt;if(p.shieldT>0)p.shieldT-=dt;if(p.shieldCd>0)p.shieldCd-=dt;
  if(p.hidden)return;
  if(p.dead){p.vy+=GRAV*.6*dt;p.y+=p.vy*dt;return}
  const ctrl=!L.tele&&!(L.phase&&L.phase!=='fight');
  const dir=ctrl?(K.right?1:0)-(K.left?1:0):0;
  const spd=p.giant?230:205,knock=p.inv>1.05;
  if(!knock){if(dir){p.vx+=(dir*spd-p.vx)*Math.min(1,dt*(p.onGround?16:9));p.face=dir}else p.vx+=(0-p.vx)*Math.min(1,dt*(p.onGround?14:4))}
  if(jumpBuf>0)jumpBuf-=dt;
  if(p.onGround)p.coy=.1;else p.coy-=dt;
  if(ctrl&&jumpBuf>0&&p.coy>0){p.vy=p.giant?-730:-645;p.coy=0;jumpBuf=0;SFX.jump()}
  if(!K.jump&&p.vy<-260&&!knock)p.vy=-260;
  p.prevBottom=p.y+p.h;
  physics(p,dt);
  if(p.heads&&p.heads.length){const cx=p.x+p.w/2;let best=null,bd=1e9;for(const s of p.heads){const d=Math.abs(s.x+s.w/2-cx);if(d<bd){bd=d;best=s}}headHit(best)}
  if(p.onGround&&p.groundS&&p.groundS.kind==='ground'){p.safeS=p.groundS;p.safeX=p.x}
  if(p.y>VH+80)fallPit();
  if(Math.abs(p.vx)>25&&p.onGround)p.walkT+=dt;
  if(ctrl){
    if(swPress){if(p.giant){if(p.shieldCd<=0){p.shieldT=1.3;p.shieldCd=3.2;SFX.power()}else toast('🛡️ המגן נטען...',900)}
      else if(G.weapons.length>1){const i=G.weapons.indexOf(G.weapon);G.weapon=G.weapons[(i+1)%G.weapons.length];toast(WEAPONS[G.weapon].icon+' '+WEAPONS[G.weapon].name,1000);SFX.bump()}}
    if((atkPress||K.atk)&&p.atkCd<=0)doAttack();
  }
  atkPress=0;swPress=0;
  // melee hits
  if(!p.giant&&p.atkT>.07){const W=WEAPONS[G.weapon];if(W.type==='melee'){
    const hb={x:p.face>0?p.x+p.w-4:p.x-W.range+4,y:p.y+2,w:W.range,h:p.h-4};
    for(const e of L.enemies)if(e.alive&&e.lastSwing!==p.swing&&ov(hb,e)){e.lastSwing=p.swing;damageEnemy(e,W.dmg)}
    const B=L.boss;if(B&&B.active&&!B.dead&&B.lastSwing!==p.swing&&ov(hb,B)){B.lastSwing=p.swing;damageBoss(B,W.dmg)}
  }}
}

function updateEnemies(dt){
  for(const e of L.enemies){
    if(!e.alive)continue;if(e.flash>0)e.flash-=dt;
    if(!e.awake){if(e.x<cam.x+viewW+80)e.awake=true;else continue}
    if(e.type==='scribble'){e.vx=e.dir*62;physics(e,dt);if(e.hitWall)e.dir*=-1;
      if(e.onGround){const fx=e.dir>0?e.x+e.w+2:e.x-2;if(!solidAt(fx,e.y+e.h+4))e.dir*=-1}}
    else if(e.type==='blob'||e.type==='crumb'){if(e.onGround){e.vx=0;e.t-=dt;if(e.t<=0&&Math.abs(P.x-e.x)<420){e.vy=-430;e.vx=Math.sign(P.x-e.x)*130;e.t=1+Math.random()}}
      physics(e,dt)}
    else{e.t+=dt;if(Math.abs(P.x-e.bx)<320)e.bx+=Math.sign(P.x-e.bx)*28*dt;e.x=e.bx+Math.sin(e.t*1.4)*70;e.y=e.by+Math.sin(e.t*3)*22}
    if(e.y>VH+60){e.alive=false;continue}

      else hurtPlayer(1,e.x+e.w/2);
    }
  }
}

function updateBoss(B,dt){
  if(B.flash>0)B.flash-=dt;
  if(B.dead){B.deadT+=dt;return}
  if(!B.active){if(B.type!=='bat'&&B.vis){physics(B,dt);
      if(L.type==='final'&&L.phase==='fall'&&B.onGround&&!L.landed){L.landed=true;shake=16;SFX.slam();puff(B.x+B.w/2,GROUND-4,'#222',20,220);
        L.timers.push({t:.8,fn:()=>say(STORY.final.taunt(),()=>{L.phase='grow';L.growT=0;SFX.tele()})})}}
    return}
  const pc=P.x+P.w/2,bc=B.x+B.w/2,dirTo=Math.sign(pc-bc)||1,rage=B.hp<B.maxHp/2?1.35:1;
  if(B.type==='ink'||B.type==='mini1'||B.type==='mini2'){
    if(B.st==='idle'){B.vx=0;B.face=dirTo;B.t-=dt*rage;if(B.t<=0&&B.onGround){B.st='air';B.vy=-660;B.vx=clamp((pc-bc)*1.15,-280,280)}}
    physics(B,dt);
    if(B.st==='air'&&B.onGround){B.st='idle';B.t=1.1;slam(B)}
  } else if(B.type==='bat'){
    B.t+=dt;B.dropT-=dt*rage;B.swT-=dt;
    const cx=L.arenaX+L.arenaW/2;let tx,ty,k;
    if(B.st==='fly'){tx=cx+Math.sin(B.t*.7)*(L.arenaW/2-120)-B.w/2;ty=78+Math.sin(B.t*2.1)*22;k=2.2;
      if(B.swT<=0){B.st='down';B.tx=clamp(pc-B.w/2,L.arenaX+10,L.arenaX+L.arenaW-B.w-10);B.t2=0}}
    else if(B.st==='down'){B.t2+=dt;tx=B.tx;ty=GROUND-B.h-4;k=3;if(B.t2>1.15){B.st='up';B.t2=0}}
    else{B.t2+=dt;tx=B.tx+(B.tx<cx?200:-200);ty=78;k=2.2;if(B.t2>1){B.st='fly';B.swT=4.6/rage}}
    const ox=B.x;B.x+=(tx-B.x)*Math.min(1,dt*k);B.y+=(ty-B.y)*Math.min(1,dt*k);if(Math.abs(B.x-ox)>.3)B.face=Math.sign(B.x-ox);
  } else if(B.type==='sharp'){
    if(B.st==='walk'){B.face=dirTo;B.vx=dirTo*75*rage;B.t-=dt;B.shotT-=dt;
      if(B.shotT<=0){B.shotT=2.6/rage;for(let q=0;q<3;q++)eshot('shav',bc,B.y+12,dirTo*(110+q*75),-430-q*40,1,7)}
      if(B.t<=0){B.st='prep';B.t=.75;B.vx=0}}
    else if(B.st==='prep'){B.vx=0;B.t-=dt;if(B.t<=0){B.st='charge';SFX.boss()}}
    else if(B.st==='charge')B.vx=B.face*420*rage;
    else if(B.st==='stun'){B.vx=0;B.t-=dt;if(B.t<=0){B.st='walk';B.t=2+Math.random()*1.5}}
    physics(B,dt);
    if(B.st==='charge'&&B.hitWall){B.st='stun';B.t=1.5;shake=10;SFX.slam();
      for(let q=0;q<4;q++)eshot('shav',L.arenaX+60+Math.random()*(L.arenaW-120),-40,0,60,.5,7)}
  } else if(B.type==='eraser'){
    if(B.st==='walk'){B.face=dirTo;B.vx=dirTo*70*rage;B.t-=dt;
      if(B.t<=0&&B.onGround){const r=Math.random();B.vx=0;B.n=0;B.t2=0;if(r<.4)B.st='throw';else if(r<.72){B.st='prep';B.t=.7}else B.st='jump'}}
    else if(B.st==='throw'){B.vx=0;B.face=dirTo;B.t2-=dt;
      if(B.t2<=0){for(let q=0;q<3;q++)eshot('crumb',bc+B.face*50,B.y+24,dirTo*(130+q*80),-470-q*40,1,8);SFX.shoot();B.n++;B.t2=.6;if(B.n>=2){B.st='walk';B.t=1.7}}}
    else if(B.st==='prep'){B.vx=0;B.t-=dt;if(B.t<=0){B.st='charge';SFX.boss()}}
    else if(B.st==='charge')B.vx=B.face*400*rage;
    else if(B.st==='stun'){B.vx=0;B.t-=dt;if(B.t<=0){B.st='walk';B.t=1.8}}
    else if(B.st==='jump'){B.vy=-680;B.vx=clamp((pc-bc)*1.1,-260,260);B.st='air'}
    physics(B,dt);
    if(B.st==='charge'&&B.hitWall){B.st='stun';B.t=1.4;shake=10;SFX.slam()}
    if(B.st==='air'&&B.onGround){slam(B);B.st='walk';B.t=1.3}
  } else {
    B.t-=dt*rage;B.backT-=dt;const gi=P.giant;
    if(B.st==='walk'){B.face=dirTo;const dist=Math.abs(pc-bc);B.vx=dist>(gi?130:80)?dirTo*88:0;
      if(dist<(gi?95:66)&&B.onGround&&B.backT<=0){B.vy=-520;B.vx=-dirTo*300;B.st='hop';B.backT=2.4}
      else if(B.t<=0&&B.onGround){const r=Math.random();if(B.type==='merged')B.st=r<.3?'shoot':r<.52?'jump':r<.74?'rain':'throw';else B.st=r<.42?'shoot':r<.72?'jump':'rain';B.n=0;B.t2=0}}
    else if(B.st==='throw'){B.vx=0;B.face=dirTo;B.t2-=dt;
      if(B.t2<=0){for(let q=0;q<3;q++)eshot('crumb',bc+B.face*50,B.y+B.h-80,dirTo*(140+q*80),-480-q*40,1,9);SFX.shoot();B.n++;B.t2=.55;if(B.n>=2){B.st='walk';B.t=1.6}}}
    else if(B.st==='shoot'){B.vx=0;B.face=dirTo;B.t2-=dt;
      if(B.t2<=0){const ox=bc+B.face*(B.type==='merged'?46:22),oy=B.y+(B.type==='merged'?75:46),ty=P.y+P.h*(gi?.35:.5),a=Math.atan2(ty-oy,pc-ox),sp=gi?320:250;

        if(B.n>=(rage>1?5:3)){B.st='walk';B.t=1.7}}}
    else if(B.st==='jump'){B.vy=-760;B.vx=clamp((pc-bc)*1.2,-300,300);B.st='air'}

      for(let q=0;q<cnt;q++){const x=clamp(pc+(q-(cnt-1)/2)*(gi?90:72)+(Math.random()-.5)*24,L.arenaX+20,L.arenaX+L.arenaW-20);L.warns.push({x,t:.85+q*.07})}
      B.st='walk';B.t=2.4;SFX.boss()}
    physics(B,dt);
    if((B.st==='air'||B.st==='hop')&&B.onGround){if(B.st==='air')slam(B);B.st='walk';B.t=Math.max(B.t,1.2)}

    const stompable=['ink','bat','sharp','mini1','mini2','eraser'].includes(B.type);
    if(stompable&&!P.giant&&P.prevBottom<=B.y+12&&P.vy>0){damageBoss(B,2);P.vy=-520;SFX.stomp()}
    else hurtPlayer(1,B.x+B.w/2);
  }
}

function updateShots(dt){
  for(const s of L.shots){
    s.x+=s.vx*dt;s.life-=dt;
    const sx=s.x+s.w/2,sy=s.y+s.h/2,hs=solidAt(sx,sy);
    if(hs){s.life=0;puff(sx,sy,s.kind==='eraser'?'#ff8fb3':'#ffe14d',4,80);continue}
    for(const e of L.enemies){if(!e.alive||s.hit.has(e)||!ov(s,e))continue;s.hit.add(e);damageEnemy(e,s.dmg);if(!s.pierce){s.life=0;break}}
    const B=L.boss;if(s.life>0&&B&&B.active&&!B.dead&&!s.hit.has(B)&&ov(s,B)){s.hit.add(B);damageBoss(B,s.dmg);if(!s.pierce)s.life=0}
  }
  L.shots=L.shots.filter(s=>s.life>0);
  for(const e of L.eshots){
    e.vy+=GRAV*e.g*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;
    if(e.y>-50&&solidAt(e.x,e.y+e.r*.6)){e.life=0;puff(e.x,e.y,e.kind==='shav'?'#e8b878':'#2a1650',5,90);continue}
    if(!P.dead&&!P.hidden&&e.x+e.r>P.x&&e.x-e.r<P.x+P.w&&e.y+e.r>P.y&&e.y-e.r<P.y+P.h){e.life=0;hurtPlayer(1,e.x)}
  }
  L.eshots=L.eshots.filter(e=>e.life>0&&e.y<VH+100);
  for(const w of L.warns){w.t-=dt;if(w.t<=0&&!w.done){w.done=true;eshot('scrib',w.x,-60,0,320,.6,P.giant?14:11)}}
  L.warns=L.warns.filter(w=>!w.done);
  for(const w of L.waves){w.x+=w.dir*260*dt;w.life-=dt;
    if(!P.dead&&!P.hidden&&Math.abs(P.x+P.w/2-w.x)<P.w/2+10&&P.y+P.h>GROUND-w.h+2)hurtPlayer(1,w.x-w.dir*10);
    if(solidAt(w.x+w.dir*12,GROUND-10))w.life=0}
  L.waves=L.waves.filter(w=>w.life>0);
}

function update(dt){
  L.t+=dt;
  for(const tm of L.timers){tm.t-=dt;if(tm.t<=0&&!tm.done){tm.done=true;tm.fn()}}
  L.timers=L.timers.filter(t=>!t.done);
  if(DQ)return;
  // triggers
  for(const tr of L.triggers)if(!tr.done&&P.x>tr.x){tr.done=true;tr.fn();if(DQ)return}
  for(const v of L.vehicles)if(v.go){v.vx=Math.min(v.vx+260*dt,v.kind==='bus'?330:360);v.x+=v.vx*dt}
  if(L.magic&&!L.tele&&P.x+P.w>L.magic.x-18&&P.x<L.magic.x+18){L.tele={t:0};SFX.tele();P.vx=0}
  if(L.tele){L.tele.t+=dt;if(Math.random()<.7)spark(P.x+12+(Math.random()-.5)*60,P.y+22+(Math.random()-.5)*60,['#ffe14d','#fff','#ff7eb6','#7fd3ff'][Math.floor(Math.random()*4)]);
    if(L.tele.t>1.9&&!L.tele.done){L.tele.done=true;nextStage()}}
  if(L.type==='final'&&L.phase==='fight'&&!G.bossSnap){G.bossSnap={weapons:[...G.weapons],weapon:G.weapon,coins:G.coins}}
  if(L.type==='final'&&L.phase==='grow'){L.growT+=dt;if(Math.random()<.8)spark(P.x+P.w/2+(Math.random()-.5)*120,GROUND-Math.random()*220,['#ffe14d','#fff','#ffcc1f'][Math.floor(Math.random()*3)]);
    if(L.growT>=1.7){L.phase='fight';P.hidden=false;PEN.vis=false;shake=8;say(STORY.final.tips(),()=>{L.boss.active=true;SFX.boss()})}}
  if(L.type==='merge'){
    if(L.phase==='merge'){L.mergeT+=dt;if(Math.random()<.9)spark(L.arenaW-210+(Math.random()-.5)*160,GROUND-Math.random()*240,['#b44dff','#ff2d55','#fff','#222'][Math.floor(Math.random()*4)]);
      if(L.mergeT>=1.6&&!L.fused){L.fused=true;shake=16;SFX.slam();fade={a:.9,dir:-1,col:'#ffffff',cb:null};const B=L.boss;B.vis=true;B.y=GROUND-B.h;
        say(STORY.merge.fused(),()=>{L.phase='fight';B.active=true;SFX.boss()})}}
    const B=L.boss;
    if(L.phase==='fight'&&B.active&&!B.dead&&!G.bossSnap)G.bossSnap={weapons:[...G.weapons],weapon:G.weapon,coins:G.coins};
    if(L.phase==='fight'&&B.active&&!B.dead){L.helpT-=dt;if(L.helpT<=0){L.helpT=2.6;const d=Math.sign(B.x+B.w/2-PEN.x)||1;L.shots.push({kind:'beam',x:PEN.x-14,y:PEN.y-14,w:28,h:28,vx:d*600,dmg:1,life:1.6,hit:new Set()});SFX.shoot()}}
  }
  updatePlayer(dt);
  if(PEN2){const tx=P.x+P.w/2+P.face*40,ty=P.y-30+Math.sin(L.t*3+1)*5;PEN2.x+=(tx-PEN2.x)*Math.min(1,dt*4);PEN2.y+=(ty-PEN2.y)*Math.min(1,dt*4)}
  // companion
  if(PEN.vis){let tx,ty;
    if(L.type==='final'){tx=95;ty=GROUND-78+Math.sin(L.t*3)*5}
    else{tx=P.x+P.w/2-P.face*34;ty=P.y-16+Math.sin(L.t*3)*5}
    PEN.x+=(tx-PEN.x)*Math.min(1,dt*5);PEN.y+=(ty-PEN.y)*Math.min(1,dt*5)}
  // coins & pickups
  for(const co of L.coins){if(co.taken)continue;if(co.x+9>P.x&&co.x-9<P.x+P.w&&co.y+9>P.y&&co.y-9<P.y+P.h){co.taken=true;addCoin(co.x,co.y-10)}}
  for(const p of L.pickups){if(p.taken)continue;if(p.rise>0){p.y-=dt*85;p.rise-=dt;continue}
    if(ov(P,p)&&!P.dead){p.taken=true;
      if(p.kind==='heart'){P.hp=Math.min(P.maxHp,P.hp+1);SFX.power();ftext(p.x+12,p.y,'❤️ +1')}
      else if(p.kind==='weapon'){if(!G.weapons.includes(p.sub))G.weapons.push(p.sub);G.weapon=p.sub;SFX.power();
        for(let i=0;i<20;i++)spark(p.x+12,p.y+12,'#ffe14d');toast(`קיבלת ${WEAPONS[p.sub].name}! ${WEAPONS[p.sub].icon} – ${g('לחץ','לחצי')} על ${WEAPONS[p.sub].icon} כדי להשתמש`,3200);checkMission()}
      else{L.prog[p.kind]=(L.prog[p.kind]||0)+1;SFX.power();for(let i=0;i<14;i++)spark(p.x+12,p.y+12,p.kind==='star'?'#ffe14d':p.kind==='gem'?'#7fe8ff':'#ff8fb3');ftext(p.x+12,p.y,ITEMICON[p.kind]);
        if(p.kind==='cage')L.friends.push({x:p.x+12,gy:p.y+34,col:['#ff7eb6','#7fd3ff','#9be36a'][p.idx%3],ph:p.idx,cheer:true});
        checkMission()}}}
  for(const s of L.solids)if(s.bump>0)s.bump-=dt;
  updateEnemies(dt);
  if(L.boss)updateBoss(L.boss,dt);
  updateShots(dt);
  for(const p of L.parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  L.parts=L.parts.filter(p=>p.life>0);
  // day end wall hint
  if(L.type==='day'&&!L.done&&P.x+P.w>=L.len-3&&(!L.hintT||L.t-L.hintT>3)){L.hintT=L.t;toast('✏️ עוד לא סיימנו את המשימה! '+missionText(),2600)}
  // arena lock
  const B=L.boss;
  if(B&&!L.locked&&!B.dead&&P.x>L.arenaX+70){L.locked=true;L.arenaWall.off=false;SFX.boss();G.bossSnap={weapons:[...G.weapons],weapon:G.weapon,coins:G.coins};
    say(STORY[STAGES[G.stage].id].boss(),()=>{B.active=true})}
  // camera
  let tx;
  if(L.locked)tx=L.arenaX+(L.arenaW-viewW)/2;
  else{tx=P.x+P.w/2-viewW*.42;const mx=L.type==='day'||L.type==='school'?L.len-viewW:L.arenaX+L.arenaW-viewW;tx=clamp(tx,0,Math.max(0,mx))}
  cam.x+=(tx-cam.x)*Math.min(1,dt*7);
  if(shake>0)shake=Math.max(0,shake-dt*30);
}

function drawKid(fx,fy,id,face,t,o){

  // face

  c.save();c.translate(sx,offY+sy);
  drawParallax();
  if(L){c.translate(-cam.x,0);drawWorld()}
  else{ // menu scenery
    c.fillStyle='#b8773e';c.fillRect(0,GROUND,viewW,1200);c.fillStyle='#63d24e';c.fillRect(0,GROUND,viewW,10);c.fillStyle='#3e9f35';c.fillRect(0,GROUND+10,viewW,4);
  }
  c.restore();
  if(G.mode==='end'&&G.confetti){
    if(G.confetti.length<160)for(let i=0;i<3;i++)G.confetti.push({x:Math.random()*viewW,y:-10,vx:(Math.random()-.5)*60,vy:60+Math.random()*80,r:Math.random()*6,col:['#ffe14d','#ff7eb6','#7fd3ff','#9be36a','#ffa94d'][Math.floor(Math.random()*5)]});
    for(const p of G.confetti){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*5;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.col;c.fillRect(-4,-2,8,4);c.restore()}
    G.confetti=G.confetti.filter(p=>p.y<viewH+20);
  }
  if(fade.a>0){c.globalAlpha=fade.a;c.fillStyle=fade.col;c.fillRect(0,0,viewW+2,viewH+2);c.globalAlpha=1}
}

// ---------- main loop
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;menuT+=dt;
  if(fade.dir){fade.a+=fade.dir*dt*2.4;
    if(fade.dir>0&&fade.a>=1){fade.a=1;const cb=fade.cb;fade.cb=null;fade.dir=-1;cb&&cb()}
    else if(fade.dir<0&&fade.a<=0){fade.a=0;fade.dir=0}}
  if(G.mode==='play'&&L&&!G.paused&&fade.dir<=0)update(dt);
  else if(G.mode==='end'&&L){L.t+=dt;for(const p of L.parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}L.parts=L.parts.filter(p=>p.life>0)}
  updateHud();
  render(dt);
  if(G.mode==='menu')drawMenuKids();
  requestAnimationFrame(loop);
}

// ---------- menu
const kidCanvases={};
function buildMenu(){
  const box=$('kids');box.innerHTML='';
  for(const id of Object.keys(KIDS)){
    const b=document.createElement('button');b.className='kcard'+(id===kidId?' sel':'');
    const cvk=document.createElement('canvas');cvk.width=160;cvk.height=208;kidCanvases[id]=cvk;
    const nm=document.createElement('span');nm.textContent=KIDS[id].name;
    b.appendChild(cvk);b.appendChild(nm);
    b.onclick=()=>{initAudio();kidId=id;document.querySelectorAll('.kcard').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');SFX.coin()};
    box.appendChild(b);
  }
  const s=loadSave(),bc=$('bCont');
  if(s&&s.stage>0&&s.stage<STAGES.length&&KIDS[s.kid]){bc.style.display='inline-block';bc.textContent=`⏩ המשך: ${KIDS[s.kid].name} · ${STAGES[s.stage].name}`}else bc.style.display='none';
}
function drawMenuKids(){
  const save=c;
  for(const id in kidCanvases){const k=kidCanvases[id],kc=k.getContext('2d');
    kc.setTransform(1,0,0,1,0,0);kc.clearRect(0,0,k.width,k.height);
    const gr=kc.createLinearGradient(0,0,0,k.height);gr.addColorStop(0,'#bfe9ff');gr.addColorStop(1,'#e9fbff');kc.fillStyle=gr;kc.fillRect(0,0,k.width,k.height);
    kc.fillStyle='#63d24e';kc.fillRect(0,182,k.width,26);
    kc.setTransform(3.4,0,0,3.4,0,0);
    swapCtx(kc);drawKid(80/3.4,184/3.4,id,1,menuT,{wave:id===kidId,walk:false});swapCtx(save);
  }
}
function swapCtx(k){c=k}
function showMenu(){
  G.mode='menu';L=null;DQ=null;$('dialog').style.display='none';
  $('hud').style.display='none';$('controls').style.display='none';$('bossbar').style.display='none';$('end').style.display='none';$('pauseOv').style.display='none';
  $('menu').style.display='flex';buildMenu();
}
$('bStart').onclick=()=>{initAudio();clearSave();G.coins=0;G.weapons=['fist'];G.weapon='fist';$('menu').style.display='none';fadeTo('#000',()=>startStage(0))};
$('bCont').onclick=()=>{initAudio();const s=loadSave();if(!s)return;kidId=s.kid;G.coins=s.coins||0;G.weapons=s.weapons||['fist'];G.weapon=s.weapon||'fist';$('menu').style.display='none';fadeTo('#000',()=>startStage(s.stage))};
$('bAgain').onclick=()=>{initAudio();showMenu()};

showMenu();
requestAnimationFrame(loop);
</script>
